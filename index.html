/* =====================  UTILIDADES  ===================== */
const $=s=>document.querySelector(s);
const clone=o=>JSON.parse(JSON.stringify(o));

const setP=(o,p,v)=>{const ks=p.split('.');const l=ks.pop();ks.reduce((a,k)=>a[k],o)[l]=v};
const fmt=n=>new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(+n||0);

function h(tag,attrs,...kids){
  const e=document.createElement(tag);
  for(const[k,v]of Object.entries(attrs||{})){
    if(k==='class')e.className=v;
    else if(v===true)e.setAttribute(k,'');
    else if(v!==false&&v!=null)e.setAttribute(k,v);
  }
  kids.flat().forEach(c=>{if(c==null||c===false)return;e.append(c.nodeType?c:document.createTextNode(String(c)))});
  return e;
}
function merge(base,over){
  if(Array.isArray(base))return Array.isArray(over)?over:base;
  if(base&&typeof base==='object'){
    const o={...base};
    if(over&&typeof over==='object')for(const k in over)o[k]=(k in base)?merge(base[k],over[k]):over[k];
    return o;
  }
  return over===undefined?base:over;
}
async function compress(file,maxW=900,q=.78){
  const url=URL.createObjectURL(file);
  const img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=url});
  const s=Math.min(1,maxW/img.naturalWidth);
  const w=Math.round(img.naturalWidth*s),hh=Math.round(img.naturalHeight*s);
  const c=document.createElement('canvas');c.width=w;c.height=hh;
  c.getContext('2d').drawImage(img,0,0,w,hh);
  URL.revokeObjectURL(url);
  let d=c.toDataURL('image/webp',q);
  if(!d.startsWith('data:image/webp'))d=c.toDataURL('image/jpeg',q);
  return{dataUrl:d,w,h:hh,bytes:Math.round((d.length-d.indexOf(',')-1)*.75)};
}

function injectHTML(code){
  const box=document.createElement('div');box.innerHTML=code;
  box.querySelectorAll('script').forEach(old=>{
    const s=document.createElement('script');
    [...old.attributes].forEach(a=>s.setAttribute(a.name,a.value));
    s.text=old.textContent;document.head.appendChild(s);old.remove();
  });

}

const fontsLoaded=new Set();
function loadFont(name){
  if(!FQ[name]||fontsLoaded.has(name))return;
  fontsLoaded.add(name);
  document.head.appendChild(h('link',{rel:'stylesheet',href:'https://fonts.googleapis.com/css2?family='+FQ[name]+'&display=swap'}));
}
function applyDesign(){
  const d=cfg.design,r=document.documentElement.style;
  ['bg','bg2','card','text','accent','accentText','price','badge'].forEach(k=>r.setProperty('--'+k,d[k]));
  r.setProperty('--bgfull',d.gradient?`linear-gradient(180deg,${d.bg} 0%,${d.bg2} 100%)`:d.bg);
  r.setProperty('--hf',`'${d.headingFont}',Impact,sans-serif`);
  r.setProperty('--bf',`'${d.bodyFont}',system-ui,sans-serif`);
  r.setProperty('--hw',BOLD_HEADINGS.includes(d.headingFont)?'700':'400');
  r.setProperty('--r',d.radius+'px');
  r.fontSize=d.baseSize+'px';
  loadFont(d.headingFont);loadFont(d.bodyFont);
  const m=document.querySelector('meta[name=theme-color]');if(m)m.content=d.bg;
}

function imgEl(o,alt,eager){
  const i=h('img',{src:o.src,alt:alt||'',decoding:'async'});
  if(o.w&&o.h){i.width=o.w;i.height=o.h}
  if(!eager)i.loading='lazy';
  return i;
}
function renderTop(){
  const t=$('#top');t.innerHTML='';
  const b=cfg.brand||{};
  if(b.logo&&b.logo.src)t.append(imgEl(b.logo,b.name||'Logo',true));
  else if(b.name)t.append(h('div',{class:'brand'},b.name));
}
let autoT=null;
function renderHero(){
  const el=$('#hero');el.innerHTML='';clearInterval(autoT);
  const c=cfg.hero;
  el.append(h('h1',{},c.title),c.subtitle?h('p',{},c.subtitle):null);
  const slides=(c.slides||[]).filter(s=>s&&s.src);
  if(slides.length){
    const tr=h('div',{class:'track'});
    slides.forEach((s,i)=>tr.append(h('div',{class:'slide'},imgEl(s,'Promoción de Halloween '+(i+1),i===0))));
    const sl=h('div',{class:'slider'},tr);
    let dots=[];
    if(slides.length>1){
      const dw=h('div',{class:'dots'});
      dots=slides.map((_,i)=>h('i',{class:'dot'+(i?'':' on')}));
      dw.append(...dots);sl.append(dw);
    }
    el.append(sl);
    if(slides.length>1){
      let idx=0;
      const kids=[...tr.children];
      const fit=()=>{const k=kids[idx];if(k)sl.style.height=k.getBoundingClientRect().height+'px'};
      tr.addEventListener('scroll',()=>{
        const i=Math.round(tr.scrollLeft/(tr.clientWidth||1));
        if(i!==idx&&kids[i]){idx=i;dots.forEach((d,j)=>d.classList.toggle('on',j===idx));fit()}
      },{passive:true});
      kids.forEach(k=>k.querySelector('img').addEventListener('load',fit));
      window.onresize=fit;fit();
      if(c.autoplay){
        let paused=false;
        tr.addEventListener('touchstart',()=>paused=true,{passive:true});
        tr.addEventListener('touchend',()=>setTimeout(()=>paused=false,5000),{passive:true});
        autoT=setInterval(()=>{if(paused||document.hidden)return;tr.scrollTo({left:((idx+1)%kids.length)*tr.clientWidth,behavior:'smooth'})},4500);
      }
    }
  }
  if(c.button)el.append(h('div',{class:'cta'},h('a',{class:'btn',href:'#promos'},c.button)));
}

function openOrder(id){
  const p=cfg.products.find(x=>x.id===id);if(!p)return;
  S={p,qty:1};
  const f=cfg.form,b=$('#ovB');b.innerHTML='';
  const tot=h('span',{class:'tot'},fmt(p.price));
  const out=h('output',{},'1');
  const upd=()=>{out.textContent=S.qty;tot.textContent=fmt(+p.price*S.qty)};
  b.append(h('h2',{id:'ovT'},f.title),h('p',{class:'intro'},f.intro));
  b.append(h('div',{class:'sum'},p.image&&p.image.src?h('img',{src:p.image.src,alt:''}):null,h('div',{},h('b',{},p.title),h('span',{},fmt(p.price)))));
  if(f.qty){
    const minus=h('button',{type:'button','aria-label':'Menos'},'−'),plus=h('button',{type:'button','aria-label':'Más'},'+');
    minus.onclick=()=>{S.qty=Math.max(1,S.qty-1);upd()};
    plus.onclick=()=>{S.qty=Math.min(20,S.qty+1);upd()};
    b.append(h('div',{class:'qty'},h('div',{class:'st'},minus,out,plus),tot));
  }else b.append(h('div',{class:'qty'},h('span',{},'Total'),tot));
  const form=h('form',{novalidate:true});
  const els={},errs={};
  const fld=(key,label,o={})=>{
    const inp=o.area?h('textarea',{rows:2}):h('input',{type:o.type||'text'});
    inp.name=key;if(o.ac)inp.autocomplete=o.ac;if(o.im)inp.inputMode=o.im;
    const er=h('div',{class:'er'});
    els[key]=inp;errs[key]=er;
    form.append(h('label',{class:'fl'},h('span',{},label+(o.req?' *':'')),inp,er));
  };
  fld('name','Nombre completo',{req:1,ac:'name'});
  if(f.fields.phone)fld('phone','Celular / WhatsApp',{req:1,type:'tel',ac:'tel',im:'tel'});
  if(f.fields.city)fld('city','Ciudad',{req:1,ac:'address-level2'});
  if(f.fields.address)fld('address','Dirección de entrega',{req:1,ac:'street-address'});
  if(f.fields.notes)fld('notes','Observaciones (opcional)',{area:1});
  const submit=h('button',{class:'btn block',type:'submit'},f.submit);
  const fb=h('p',{class:'fb'});
  form.append(submit,fb);
  form.addEventListener('submit',e=>{
    e.preventDefault();
    const v={};let ok=true,first=null;
    for(const k in els){
      const val=els[k].value.trim();let m='';
      if(k!=='notes'&&!val)m='Este campo es obligatorio';
      else if(k==='name'&&val.length<3)m='Escribe tu nombre completo';
      else if(k==='phone'&&!/^\+?\d[\d\s-]{6,15}$/.test(val))m='Escribe un número válido';
      errs[k].textContent=m;
      if(m){ok=false;if(!first)first=els[k]}
      v[k]=val;
    }
    if(!ok){first.focus();return}
    const total=+p.price*S.qty;
    const L=['🎃 Combo: '+p.title,'🔢 Cantidad: '+S.qty,'💰 Total: '+fmt(total),'','👤 Nombre: '+v.name];
    if(v.phone)L.push('📱 Celular: '+v.phone);
    if(v.city)L.push('📍 Ciudad: '+v.city);
    if(v.address)L.push('🏠 Dirección: '+v.address);
    if(v.notes)L.push('📝 Notas: '+v.notes);
    const url='https://wa.me/'+waNumber()+'?text='+encodeURIComponent(f.greeting+'\n\n'+L.join('\n'));
    track('Lead',{content_name:p.title,content_ids:[p.id],value:total,currency:'COP',num_items:S.qty});
    submit.disabled=true;submit.textContent='Abriendo WhatsApp…';
    fb.innerHTML='';fb.append('¿No se abrió? ',h('a',{href:url,target:'_blank',rel:'noopener'},'Toca aquí para continuar'));
    setTimeout(()=>{location.href=url;setTimeout(()=>{submit.disabled=false;submit.textContent=f.submit},2500)},350);
  });
  b.append(form);
  $('#ov').classList.add('open');document.body.classList.add('lock');
  track('InitiateCheckout',{content_name:p.title,content_ids:[p.id],value:+p.price,currency:'COP'});
  setTimeout(()=>els.name.focus({preventScroll:true}),300);
}

  try{localStorage.setItem(KEY,JSON.stringify(cfg));localStorage.setItem(KEY+'_dirty','1');status('✓ Borrador guardado en este navegador (aún no publicado: ve a la pestaña Publicar)')}
  catch(e){status('⚠ Memoria del navegador llena. Descarga el config.json desde Publicar.',true)}

function changed(path){
  const sec=path.split('.')[0];
  if(sec==='design')applyDesign();
  else if(sec==='hero')renderHero();
  else if(sec==='brand')renderTop();
  else if(sec==='footer')renderFooter();
  else if(sec==='products'||sec==='sectionTitle'||sec==='ui')renderProducts();
  else if(sec==='pageTitle')document.title=cfg.pageTitle;
  else if(sec==='whatsapp'||path==='form.floatMsg')renderFloat();
  clearTimeout(saveT);saveT=setTimeout(save,300);
}
const U={
  text(label,path,o={}){
    const inp=o.area?h('textarea',{rows:o.rows||3}):h('input',{type:o.type||'text',placeholder:o.ph||'',inputmode:o.inputmode||null});
    inp.value=getP(cfg,path)??'';
    inp.addEventListener('input',()=>{let v=inp.value;if(o.num)v=+v||0;setP(cfg,path,v);changed(path)});
    return h('label',{class:'f'},h('span',{},label),inp,o.hint?h('small',{},o.hint):null);
  },
  check(label,path){
    const i=h('input',{type:'checkbox'});i.checked=!!getP(cfg,path);
    i.addEventListener('change',()=>{setP(cfg,path,i.checked);changed(path)});
    return h('label',{class:'c'},i,h('span',{},label));
  },
  color(label,path){
    const i=h('input',{type:'color'});i.value=getP(cfg,path);const code=h('code',{},i.value);
    i.addEventListener('input',()=>{setP(cfg,path,i.value);code.textContent=i.value;changed(path)});
    return h('div',{class:'col'},i,h('span',{},label),code);
  },
  select(label,path,opts){
    const s=h('select');opts.forEach(o=>s.append(h('option',{value:o},o)));s.value=getP(cfg,path);
    s.addEventListener('change',()=>{setP(cfg,path,s.value);changed(path)});
    return h('label',{class:'f'},h('span',{},label),s);
  },
  range(label,path,min,max,step,unit){
    const r=h('input',{type:'range',min,max,step});r.value=getP(cfg,path);
    const val=h('code',{},r.value+unit);
    r.addEventListener('input',()=>{setP(cfg,path,+r.value);val.textContent=r.value+unit;changed(path)});
    return h('label',{class:'f'},h('span',{},label+' '),val,r);
  },
  image(label,path,o={}){
    const cur=()=>getP(cfg,path)||{};
    const prev=h('img',{alt:''}),info=h('small',{}),dl=h('a',{class:'btnx',style:'display:none;text-decoration:none'},'⬇ Descargar imagen comprimida');
    const url=h('input',{type:'text',placeholder:'o escribe una ruta/URL: img/mi-foto.webp'});
    const file=h('input',{type:'file',accept:'image/*'});
    const show=()=>{
      const c=cur(),src=c.src||'';
      prev.style.display=src?'block':'none';prev.src=src;
      url.value=src.startsWith('data:')?'':src;
      if(src.startsWith('data:')){dl.style.display='inline-block';dl.href=src;dl.download=(label.replace(/\W+/g,'-').toLowerCase()||'imagen')+'.webp'}else dl.style.display='none';
    };
    file.addEventListener('change',async()=>{
      const f=file.files[0];if(!f)return;
      info.textContent='Comprimiendo…';
      try{
        const r=await compress(f,o.max||900);
        setP(cfg,path,{src:r.dataUrl,w:r.w,h:r.h});
        info.textContent='Comprimida: '+kb(f.size)+' → '+kb(r.bytes)+' ('+r.w+'×'+r.h+')';
        show();changed(path);
      }catch(e){info.textContent='No pude leer esa imagen.'}
    });
    url.addEventListener('input',()=>{if(!url.value.trim())return;setP(cfg,path,{src:url.value.trim(),w:0,h:0});prev.src=url.value.trim();prev.style.display='block';changed(path)});
    show();
    return h('div',{class:'imgf'},h('b',{},label),prev,file,info,url,dl);
  }
};

  w.append(gh);
  const size=new Blob([JSON.stringify(cfg)]).size;
  const embedded=[];
  const scan=(o,label)=>{if(o&&o.src&&o.src.startsWith('data:'))embedded.push({label,src:o.src})};
  scan(cfg.brand.logo,'logo');cfg.hero.slides.forEach((s,i)=>scan(s,'banner-'+(i+1)));cfg.products.forEach(p=>scan(p.image,p.id));
  w.append(
    h('div',{class:'note'},h('b',{},'Sin token (manual)'),h('ol',{},
      h('li',{},'Toca “Descargar config.json”.'),
      h('li',{},'Súbelo al repositorio, junto a index.html (reemplaza el anterior).'))),
    h('p',{},'Los cambios son un borrador en este navegador hasta que publiques. Tamaño actual: '+kb(size)+(size>1500000?' ⚠ pesado: sube las imágenes como archivos a la carpeta img/ y pon su ruta en cada imagen.':'')+'.')
  );
  const dl=h('button',{class:'btnx pri',type:'button'},'⬇ Descargar config.json');
  dl.onclick=()=>{
    const a=h('a',{href:URL.createObjectURL(new Blob([JSON.stringify(cfg,null,1)],{type:'application/json'})),download:'config.json'});
    document.body.append(a);a.click();a.remove();
  };
  const imp=h('input',{type:'file',accept:'application/json,.json'});
  imp.onchange=async()=>{
    try{const j=JSON.parse(await imp.files[0].text());cfg=merge(clone(DEFAULTS),j);renderAll();changed('x');rebuildTab();status('✓ Configuración importada')}
    catch(e){status('No pude leer ese archivo',true)}
  };
  const reset=h('button',{class:'btnx dan',type:'button'},'↺ Restablecer todo');
  reset.onclick=()=>{if(confirm('Se borrarán tus cambios locales y volverá la versión original.')){try{localStorage.removeItem(KEY);localStorage.removeItem(KEY+'_dirty')}catch(e){}cfg=clone(DEFAULTS);renderAll();rebuildTab();status('Restablecido')}};
  const exit=h('button',{class:'btnx',type:'button'},'Salir del modo editor');
  exit.onclick=()=>{try{sessionStorage.removeItem('lp_adm')}catch(e){}location.hash='';location.search='';location.reload()};
  w.append(dl,h('h4',{},'Importar'),imp,h('h4',{},'Otras acciones'),reset,exit);
  if(embedded.length){
    w.append(h('h4',{},'Imágenes subidas desde el editor'),h('p',{},'Ya van comprimidas. Si prefieres alojarlas como archivos, descárgalas, súbelas a img/ y pon la ruta en cada imagen.'));
    embedded.forEach(e=>w.append(h('a',{class:'btnx',style:'text-decoration:none;display:inline-block',href:e.src,download:e.label+'.webp'},'⬇ '+e.label+' · '+kb(e.src.length*.75))));
  }
  return w;
}
/* ---------- Publicar en GitHub (config.json + imágenes) ---------- */
const GHK='lp_gh';
function ghLoad(){
  let g={};try{g=JSON.parse(localStorage.getItem(GHK)||'{}')}catch(e){}
  if(!g.repo&&/\.github\.io$/.test(location.hostname)){
    const o=location.hostname.replace('.github.io','');
    const r=location.pathname.split('/').filter(Boolean)[0];
    g.repo=o+'/'+(r&&!/\.html?$/.test(r)?r:o+'.github.io');
  }
  g.branch=g.branch||'main';return g;
}
const b64=str=>btoa(unescape(encodeURIComponent(str)));
async function ghPut(g,path,contentB64,msg){
  const api='https://api.github.com/repos/'+g.repo+'/contents/'+path.split('/').map(encodeURIComponent).join('/');
  const H={Authorization:'Bearer '+g.token,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
  let sha;
  const r0=await fetch(api+'?ref='+encodeURIComponent(g.branch)+'&t='+Date.now(),{headers:H});
  if(r0.ok)sha=(await r0.json()).sha;
  else if(r0.status!==404)throw new Error(r0.status===401?'Token no válido o vencido':r0.status===403?'El token no tiene permiso (Contents: Read and write)':'GitHub respondió '+r0.status+' (revisa repositorio y rama)');
  const r=await fetch(api,{method:'PUT',headers:{...H,'Content-Type':'application/json'},body:JSON.stringify({message:msg,content:contentB64,branch:g.branch,...(sha?{sha}:{})})});
  if(!r.ok){const t=await r.json().catch(()=>({}));throw new Error(t.message||('GitHub respondió '+r.status))}
}
async function publishGitHub(g,btn){
  if(!/^[\w.-]+\/[\w.-]+$/.test(g.repo||''))return status('Escribe el repositorio como usuario/repositorio',true);
  if(!g.token)return status('Falta el token de GitHub',true);
  btn.disabled=true;
  try{
    localStorage.setItem(GHK,JSON.stringify(g));
    const imgs=[];
    const scan=(o,l)=>{if(o&&o.src&&o.src.startsWith('data:'))imgs.push({o,l})};
    scan(cfg.brand.logo,'logo');cfg.hero.slides.forEach((x,i)=>scan(x,'banner-'+(i+1)));cfg.products.forEach(x=>scan(x.image,x.id));
    let n=0;
    for(const it of imgs){
      n++;status('Subiendo imagen '+n+' de '+imgs.length+'…');
      const m=/^data:image\/(\w+);base64,(.*)$/.exec(it.o.src);if(!m)continue;
      const path='img/'+it.l.replace(/[^\w-]+/g,'-').toLowerCase()+'-'+Date.now().toString(36)+'.'+(m[1]==='jpeg'?'jpg':m[1]);
      await ghPut(g,path,m[2],'Editor: imagen '+it.l);
      it.o.src=path;
    }
    status('Subiendo configuración…');
    await ghPut(g,'config.json',b64(JSON.stringify(cfg,null,1)),'Editor: actualizar landing');
    try{localStorage.setItem(KEY,JSON.stringify(cfg));localStorage.removeItem(KEY+'_dirty')}catch(e){}
    status('✓ Publicado. GitHub Pages tarda 1–2 minutos en mostrarlo a todos.');
    rebuildTab();
  }catch(e){status('⚠ '+e.message,true);btn.disabled=false}
}
const TABS={General:tabGeneral,Combos:tabCombos,'Diseño':tabDesign,Formulario:tabForm,Pixel:tabPixel,Publicar:tabPublish};
function showTab(t){
  tab=t;
  document.querySelectorAll('#admTabs button').forEach(b=>b.classList.toggle('on',b.textContent===t));
  const bd=$('#admBd'),top=bd.scrollTop;bd.innerHTML='';bd.append(TABS[t]());bd.scrollTop=top;
}
function buildAdmin(){
  const root=$('#admRoot');
  const gear=h('button',{class:'gear',type:'button'},'⚙ Editor');
  const panel=h('div',{class:'adm',id:'adm'});
  const close=h('button',{type:'button'},'👁 Ver página');
  panel.append(h('div',{class:'hd'},h('b',{},'Editor de la landing'),close),
    h('div',{class:'tabs',id:'admTabs'},Object.keys(TABS).map(t=>{const b=h('button',{type:'button'},t);b.onclick=()=>showTab(t);return b})),
    h('div',{class:'bd',id:'admBd'}),
    h('div',{class:'st',id:'admSt'},'Los cambios se ven al instante y se guardan en este navegador.'));
  root.append(gear,panel);
  gear.onclick=()=>{panel.classList.add('open');gear.style.display='none'};
  close.onclick=()=>{panel.classList.remove('open');gear.style.display=''};
  showTab('General');
  if(wantAdmin){panel.classList.add('open');gear.style.display='none'}
}

/* =====================  ARRANQUE  ===================== */
(async()=>{
  await loadConfig();
  renderAll();
  initTracking();
  if(ADMIN)buildAdmin();
})();
})();
